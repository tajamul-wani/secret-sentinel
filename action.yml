name: Secret Sentinel
description: Scan pull request and pushed commits for hardcoded secrets.
branding:
  icon: shield
  color: red

inputs:
  fail-on:
    description: Minimum severity that fails the step (LOW, MEDIUM, HIGH, CRITICAL).
    default: LOW
  sarif:
    description: "Upload results to code scanning instead of printing them. Needs security-events: write permission."
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: "3.12"

    - name: Install Secret Sentinel
      shell: bash
      run: python -m pip install --quiet "$GITHUB_ACTION_PATH"

    - name: Scan
      shell: bash
      env:
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF: ${{ inputs.sarif }}
      run: |
        # Range scans need history; checkout defaults to a single commit.
        if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
          git fetch --quiet --unshallow
        fi

        args=(--no-ai --fail-on "$FAIL_ON")
        if [[ "$SARIF" == "true" ]]; then
          args+=(--format sarif --output secret-sentinel.sarif)
        fi

        if [[ "$EVENT" == "pull_request" || "$EVENT" == "pull_request_target" ]]; then
          git fetch --quiet origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          secret-sentinel --commit-range "origin/$BASE_REF" HEAD "${args[@]}"
        elif [[ "$EVENT" == "push" && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]] \
          && git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
          secret-sentinel --commit-range "$BEFORE" HEAD "${args[@]}"
        else
          # New branches, force pushes, and other events scan the working tree.
          secret-sentinel . "${args[@]}"
        fi

    - name: Upload SARIF
      if: ${{ always() && inputs.sarif == 'true' && hashFiles('secret-sentinel.sarif') != '' }}
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
      with:
        sarif_file: secret-sentinel.sarif
        category: secret-sentinel
