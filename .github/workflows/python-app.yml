name: Python package & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run tests and verify >=80% coverage threshold
        run: python tests/run_coverage.py

      - name: Scan pull request commit range and generate SARIF report
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.base_ref }}
        run: secret-sentinel --commit-range "origin/$PR_BASE_REF" HEAD --format sarif --output results.sarif

      - name: Scan push and generate SARIF report
        if: github.event_name == 'push'
        env:
          SECRET_SENTINEL_BASELINE_KEY: ${{ secrets.SECRET_SENTINEL_BASELINE_KEY }}
        run: |
          if [[ -n "$SECRET_SENTINEL_BASELINE_KEY" && -f .secret-sentinel/baseline.json ]]; then
            secret-sentinel --baseline . --format sarif --output results.sarif
          else
            secret-sentinel . --format sarif --output results.sarif
          fi

      - name: Upload SARIF report to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: matrix.python-version == '3.12' && always()
        with:
          sarif_file: results.sarif
        continue-on-error: true

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run the repository's own action
        uses: ./
