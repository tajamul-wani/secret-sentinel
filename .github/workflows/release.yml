name: Release

# Runs when a maintainer publishes a release on GitHub. The release's tag
# must match secret_sentinel.__version__, e.g. v0.2.1.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # attach built files to the release
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(python -c 'import secret_sentinel; print(secret_sentinel.__version__)')"
          if [[ "$version" != "$TAG" ]]; then
            echo "Tag $TAG does not match package version $version" >&2
            exit 1
          fi

      - name: Test
        run: python -m unittest discover -s tests

      - name: Build
        run: |
          python -m pip install --quiet build==1.2.2.post1
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

      - name: Attach files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
