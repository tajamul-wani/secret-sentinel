[project]
name = "secret-sentinel"
version = "0.1.0"
description = "Local AI-assisted secret scanner for Git pre-commit hooks."
authors = [
  {name = "Secret Sentinel Team", email = "dev@secretsentinel.example"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["secret", "scanner", "git", "pre-commit", "security", "ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Software Development :: Version Control",
]

[project.scripts]
secret-sentinel = "secret_sentinel.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
