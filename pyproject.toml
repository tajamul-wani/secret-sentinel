[project]
name = "secret-sentinel"
dynamic = ["version"]
description = "Local secret scanner for Git repositories, hooks, and CI."
authors = [
  {name = "Tajamul Wani"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["secret", "scanner", "git", "pre-commit", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Security",
  "Topic :: Software Development :: Version Control",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-cov>=4.0.0",
  "ruff>=0.1.0",
  "mypy>=1.0.0",
]

[project.scripts]
secret-sentinel = "secret_sentinel.cli:main"

[project.urls]
Source = "https://github.com/tajamul-wani/secret-sentinel"

[tool.setuptools.dynamic]
version = {attr = "secret_sentinel.__version__"}

[tool.setuptools.packages.find]
include = ["secret_sentinel*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["secret_sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]
